# Images are built and pushed to GHCR by the CI workflow (.github/workflows/ci.yml)
# and pulled on the VPS at deploy time. CAMPBUDDY_TAG pins every service to one
# build (the commit SHA); it defaults to `latest` for local use. The `build:`
# blocks are kept so `docker compose build` still works for local development.
services:
  app:
    image: ghcr.io/onurburak9/campbuddy:${CAMPBUDDY_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      playwright:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/onurburak9/campbuddy:${CAMPBUDDY_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # python:3.11-slim has no curl; use urllib. urlopen raises (non-zero exit)
      # on any non-2xx, so this fails the container's health if /health is down.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: ghcr.io/onurburak9/campbuddy-frontend:${CAMPBUDDY_TAG:-latest}
    build: ./frontend
    ports:
      # Host port is configurable to avoid clashing with other apps (e.g. an
      # existing service on :3000). Set FRONTEND_PORT in .env; defaults to 3100.
      - "127.0.0.1:${FRONTEND_PORT:-3100}:80"
    depends_on:
      - api
    restart: unless-stopped

  playwright:
    image: ghcr.io/onurburak9/campbuddy-playwright:${CAMPBUDDY_TAG:-latest}
    build:
      context: .
      dockerfile: playwright_service/Dockerfile
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
